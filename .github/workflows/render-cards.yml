name: Render profile cards

# Redraws the animated SVG cards every morning (09:00 IST) from fresh
# contribution data, and whenever the scripts change.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "fonts/**"
      - ".github/workflows/render-cards.yml"

permissions:
  contents: write

concurrency:
  group: render-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (ASCII portrait)
        run: pip install pillow

      - name: Fetch contribution data (both accounts, merged)
        run: python scripts/fetch_contributions.py

      - name: Regenerate ASCII portrait from avatar
        run: python scripts/make_portrait.py

      - name: Render README cards (hero, tiles, activity, repos, blue graph)
        run: python scripts/render_readme_cards.py

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data assets
          if git diff --cached --quiet; then
            echo "Cards unchanged."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
